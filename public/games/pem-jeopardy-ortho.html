<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEM Jeopardy</title>
<style>
:root{color-scheme:dark;
  --bg:#141a26;--surface:#1d2533;--raised:#263042;--line:#2f3a4d;--ink:#f3f5f9;--muted:#9aa6ba;--focus:#8ab8f0;
  /* Category colors follow the zones of a pediatric resuscitation tape */
  --z0:#f0645c;--z1:#f2c94c;--z2:#5b9bef;--z3:#4cb86b;--z4:#a77bdb;--z5:#f29a4a;--zf:#f2a7c3;
  --team0:#7fd1c7;--team1:#f2a7c3;
  --display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:auto;padding:24px clamp(12px,3vw,40px) 32px}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* Masthead: large on the start and customize screens, compact during play */
.masthead{text-align:center;margin-bottom:28px}
.masthead .eyebrow,.masthead .edition{color:var(--muted);font-weight:600;font-size:clamp(.85rem,1.6vw,1rem)}
.masthead h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6.5vw,4.5rem);line-height:1;letter-spacing:-.025em;margin:.12em 0 .14em}
body:not([data-view="setup"]) .masthead{display:flex;justify-content:center;align-items:baseline;gap:.6em;margin-bottom:16px}
body:not([data-view="setup"]) .masthead .eyebrow{display:none}
body:not([data-view="setup"]) .masthead h1{font-size:1.25rem;letter-spacing:-.01em;margin:0}

/* Buttons */
button{border:1px solid var(--line);border-radius:10px;padding:.6em 1.05em;background:var(--raised);font-weight:600;cursor:pointer;line-height:1.25}
button:hover:not(:disabled){border-color:#4a5870;background:#2d384c}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.primary:hover:not(:disabled){background:#fff;border-color:#fff}
.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.quiet:hover:not(:disabled){background:var(--surface);border-color:var(--line);color:var(--ink)}
.good{background:#1f4a35;border-color:#2f7a52;color:#d3f5df}
.good:hover:not(:disabled){background:#265b41;border-color:#3d9465}
.bad{background:#4a2328;border-color:#7a3640;color:#fbd6da}
.bad:hover:not(:disabled){background:#5a2a30;border-color:#94434e}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* Forms */
label{display:block;min-width:0;color:var(--muted);font-weight:600;font-size:.9rem}
input,textarea{display:block;width:100%;margin-top:6px;padding:.6em .75em;border:1px solid var(--line);border-radius:8px;background:#10151f;color:var(--ink);font-weight:500;font-size:1rem}
input:hover,textarea:hover{border-color:#4a5870}
textarea{resize:vertical;min-height:72px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.error{color:#ff9aa5;font-size:.9rem;min-height:1.35em;margin:8px 0}
.muted{color:var(--muted)}
.label{color:var(--muted);font-weight:600;font-size:.85rem}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(16px,3vw,28px)}

/* Start screen */
.setup{display:grid;gap:16px;max-width:760px;margin:0 auto 28px}
.setup .actions{justify-content:space-between}
.rules{max-width:760px;margin:0 auto 28px;color:var(--muted)}
.rules summary{cursor:pointer;font-weight:600;color:var(--ink);width:max-content}
.rules p{margin-top:8px;max-width:68ch}

/* Scores */
.scorebar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.podium{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0;padding:12px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.team-name{display:flex;align-items:center;gap:.5em;font-weight:700;min-width:0;overflow-wrap:anywhere}
.team-name::before{content:"";flex:none;width:.7em;height:.7em;border-radius:50%;background:var(--team)}
.team0{--team:var(--team0)}.team1{--team:var(--team1)}
.score{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.6vw,2.6rem);font-variant-numeric:tabular-nums;line-height:1}
.delta{position:absolute;right:14px;top:-11px;padding:1px 9px;border-radius:999px;background:#1f4a35;color:#d3f5df;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.delta.loss{background:#4a2328;color:#fbd6da}

/* Board */
.grid{display:grid;gap:10px}
.category{display:grid;gap:10px;min-width:0}
.category h2{display:flex;align-items:flex-end;justify-content:center;text-align:center;padding:10px 6px 12px;border-top:6px solid var(--c);border-radius:4px 4px 0 0;font-size:clamp(.78rem,1.7vw,1.15rem);font-weight:700;line-height:1.2;overflow-wrap:anywhere;hyphens:auto}
.tile{min-height:clamp(48px,9vh,88px);padding:0;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3.4vw,2.6rem);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink)}
.tile:hover:not(:disabled){background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c)}
.tile.used{background:transparent;border-style:dashed;border-color:#262f3f;opacity:1}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:16px}

/* Clue screen */
.stage{--c:var(--zf);text-align:center;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:16px;padding:clamp(20px,4.5vw,52px) clamp(16px,4vw,48px)}
.stage-meta{display:flex;justify-content:center;flex-wrap:wrap;gap:.25em 1em;font-weight:700;font-size:clamp(.95rem,1.8vw,1.15rem)}
.stage-meta .cat{color:var(--c)}
.stage-meta .pts{color:var(--muted);font-variant-numeric:tabular-nums}
.clue{max-width:30ch;margin:clamp(14px,2.5vw,24px) auto clamp(20px,3.5vw,36px);font-size:clamp(1.5rem,4.2vw,3.1rem);font-weight:700;line-height:1.22;letter-spacing:-.01em;overflow-wrap:anywhere}
[tabindex="-1"]:focus{outline:none}
.answer{max-width:46rem;margin:0 auto;padding:14px 20px;border-radius:12px;background:#10151f;border:1px solid var(--line);text-align:left}
.answer .label{display:block;margin-bottom:4px}
.answer p{font-size:clamp(1.1rem,2.6vw,1.75rem);font-weight:700;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}
.answer small{display:block;margin-top:6px;color:var(--muted);font-size:.85rem}
.judges{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:46rem;margin:20px auto 0}
.judge{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;border-radius:12px;background:#10151f;border:1px solid var(--line);min-width:0}
.judge .actions{justify-content:center}
.judge small{color:var(--muted);font-weight:600}
.stage-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}
.stage .note{color:var(--muted);margin:0 auto 18px;max-width:52ch}
.wagers{max-width:46rem;margin:0 auto;text-align:left}

/* Results */
.victory h2{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.05;letter-spacing:-.02em;margin:10px 0 26px;overflow-wrap:anywhere}
.result{display:grid;gap:4px;padding:16px;border-radius:12px;background:#10151f;border:1px solid var(--line);text-align:left}
.result strong{font-family:var(--display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.result small{color:var(--muted)}
.results{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:46rem;margin:0 auto}

/* Load and edit screens */
.tool{max-width:1000px;margin:0 auto}
.tool-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px 24px;padding-bottom:18px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.tool-head h2{font-size:1.5rem;font-weight:700}
.tool-head p{margin-top:4px;max-width:62ch}
.code-input{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.5;min-height:16rem}
.tool-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.hint{color:var(--muted);font-weight:600;font-size:.9rem}
.hint:hover{color:var(--ink)}
.notice{margin:0 0 16px;padding:10px 14px;border-radius:10px;background:#1f3a2e;border:1px solid #2f6a4c;color:#d3f5df;font-weight:600}
.editor .error:empty{display:none}
.editor-body{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;align-items:start}
.tabs{display:flex;flex-direction:column;gap:2px;position:sticky;top:16px}
.tab{display:flex;align-items:center;gap:.6em;width:100%;padding:.6em .8em;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;font-weight:600}
.tab:hover:not(:disabled){background:var(--raised);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:inset 3px 0 0 var(--c,var(--ink))}
.tab .dot{flex:none;width:.65em;height:.65em;border-radius:50%;background:var(--c)}
.tab-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-divider{height:1px;margin:8px .4em;background:var(--line)}
.pane h3{font-size:1.25rem;font-weight:700;margin-bottom:16px}
.pane > label + label{margin-top:14px}
.name-field{padding-bottom:10px;font-size:.85rem}
.name-field input{margin-top:4px;padding:.4em .6em;font-size:1.4rem;font-weight:700}
.clue-row{display:grid;grid-template-columns:4.5rem minmax(0,1fr);gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.clue-row .pts{padding-top:28px;color:var(--c);font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.clue-fields{display:grid;gap:12px}
.clue-fields textarea{min-height:0}

.status{min-height:1.5em;margin:14px 0 0;text-align:center;color:var(--muted);font-weight:600;font-size:.95rem}
.source{margin-top:20px;text-align:center;color:var(--muted);font-size:.8rem}

.enter{animation:enter .28s ease-out}
.pop{animation:pop .45s ease}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{45%{transform:scale(1.1)}}

@media(max-width:600px){
  main{padding-top:16px}
  .grid,.category{gap:5px}
  .category h2{padding:6px 2px 8px;border-top-width:4px;font-size:.72rem}
  .tile{border-radius:8px}
  .podium{padding:10px 12px;flex-wrap:wrap;gap:4px}
  .fields,.results{grid-template-columns:1fr}
  .judge{padding:10px}
  .judge button{padding:.5em .7em;font-size:.9rem}
  .setup .actions{justify-content:flex-start}
}
@media(max-width:760px){
  .editor-body{grid-template-columns:1fr;gap:16px}
  .tabs{flex-direction:row;position:static;overflow-x:auto;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .tab{flex:none;width:auto}
  .tab[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--c,var(--ink))}
  .tab-divider{width:1px;height:auto;margin:6px 4px}
  .clue-row{grid-template-columns:1fr;gap:6px}
  .clue-row .pts{padding-top:0;font-size:1.2rem}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<main>
<header id="masthead" class="masthead"></header>
<div id="app"></div>
<div class="source" id="source"></div>
</main>
<script>
/* =====================================================================
   GAME CONTENT: START
   This block is the only part that changes between games. You can edit it
   here, or skip code entirely: open this file in a browser, choose
   Load clues from AI or Edit clues, then choose Download game file.
   The content must stay valid JSON (double quotes, no trailing commas).

   categories: each category is ["Category name", clue, clue, ...]
               with one clue per point value, easiest first.
   clue:       ["Clue text", "Accepted response", source]
               source is the lecture question or slide number, or null.
   finale:     ["Category", "Clue text", "Accepted response", source]
   ===================================================================== */
const GAME = {
  "title": "PEM Jeopardy",
  "eyebrow": "Pediatric EM · Board Review",
  "edition": "Orthopedics Edition",
  "source": "Clues adapted from Orthopedic Board Review, PEM Conference · Blake Barber, DO · March 2026",
  "values": [100, 200, 300, 400, 500],
  "categories": [
    ["Growth Plates",
      ["Remember SALTER: this most common physeal fracture type runs through the physis and up into the metaphysis.", "Salter–Harris type II.", 2],
      ["A 10-year-old has a nondisplaced Salter–Harris II fracture of the distal tibia. What is the ED management?", "Posterior short leg splint with orthopedic clinic follow-up.", 2],
      ["Salter–Harris III, IV, and V fractures can disrupt growth even after anatomic reduction because they involve this part of the physis.", "The germinal matrix.", 7],
      ["A Tillaux fracture is a Salter–Harris III injury of which part of the distal tibial epiphysis?", "The anterolateral distal tibial epiphysis.", 1],
      ["Above this amount of displacement, a Tillaux fracture needs internal fixation rather than closed reduction and casting.", "More than 2 mm.", 1]],
    ["Arm Arena",
      ["A 2-year-old holds her arm pronated with the elbow slightly flexed after a parent tugged her hand. Name the injury.", "Radial head subluxation (nursemaid's elbow).", 3],
      ["A 6-year-old has a nondisplaced torus fracture of the distal radius. What immobilization lets her return to activities fastest with equal healing?", "A removable functional splint, worn for 3–4 weeks.", 27],
      ["After an anterior shoulder dislocation, you test sensation over the lateral deltoid to check this nerve.", "The axillary nerve.", 20],
      ["Name the forearm injury: a proximal ulna fracture with dislocation of the radial head.", "Monteggia fracture.", 29],
      ["A football player has medial clavicle pain, dysphagia, and shortness of breath, but normal X-rays. Name the suspected injury and the imaging to order.", "Posterior sternoclavicular dislocation; CT of the chest.", 18]],
    ["The Limp Lab",
      ["A 13-year-old high jumper has heel pain at the Achilles insertion and pain when you squeeze the calcaneus. Name the condition.", "Calcaneal apophysitis (Sever disease).", 17],
      ["A 5-year-old has a limp weeks after a URI, no fever, a small hip effusion, and a normal CRP. What's the likely diagnosis?", "Transient synovitis.", 19],
      ["A synovial fluid WBC count above this threshold is considered to represent septic arthritis.", "More than 50,000 cells/µL.", 6],
      ["This hemoglobinopathy increases blood viscosity and predisposes children to avascular necrosis of the femoral head.", "Sickle cell disease.", 13],
      ["A 5-year-old has weeks of low back pain, stiffness with forward flexion, a limp, and an ESR of 60. Which imaging study is best?", "MRI of the lumbar spine with IV contrast (suspected discitis).", 16]],
    ["Trauma Trials",
      ["A teen lands on both feet after a fall from height and has bilateral calcaneal fractures. Which spine injury occurs alongside about 10% of the time?", "Vertebral compression fracture.", 12],
      ["About half of these injuries reduce before arrival, and they put the popliteal artery and common peroneal nerve at risk. Name the injury.", "Knee dislocation.", 9],
      ["A child has an open tibia fracture from a farm injury. Which IV antibiotic combination covers skin flora, gram-negative rods, and anaerobes?", "Cefazolin, gentamicin, and ampicillin.", 4],
      ["Give the formula for the ankle-brachial index and its normal range.", "Ankle (dorsalis pedis) systolic pressure ÷ brachial systolic pressure; normal 0.9–1.4.", 10],
      ["The classic 5 P's of compartment syndrome have given way to these 3 A's in children.", "Anxiety, agitation, and increasing analgesic requirement.", 25]]
  ],
  "finale": ["Off the Slopes",
    "A snowboarder's foot is forced into dorsiflexion and inversion, jamming the talus against the fibula. Name the fracture that mimics a bad ankle sprain and is often missed on X-ray.",
    "Lateral talar process fracture (snowboarder's fracture), best confirmed with CT.", 15]
};
/* =====================================================================
   GAME CONTENT: END. You shouldn't need to change anything below.
   ===================================================================== */

const { values, categories, finale } = GAME;
// Kept so "Download game file" can write out a copy of this page with new content.
const SCRIPT_SOURCE = document.currentScript.textContent;
const STYLE_SOURCE = document.querySelector("style").textContent;
const app = document.querySelector("#app");
const esc = value => String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
function renderMasthead() {
  document.title = GAME.edition ? `${GAME.title} · ${GAME.edition}` : GAME.title;
  document.querySelector("#masthead").innerHTML =
    `${GAME.eyebrow ? `<p class="eyebrow">${esc(GAME.eyebrow)}</p>` : ""}<h1>${esc(GAME.title)}</h1>${GAME.edition ? `<p class="edition">${esc(GAME.edition)}</p>` : ""}`;
  document.querySelector("#source").textContent = GAME.source || "";
}
renderMasthead();

// Turn pasted text (ideally the JSON an AI returned) into game content, or explain what's wrong.
function parseGame(text) {
  let body = text.trim().replace(/^```[a-z]*\s*/i, "").replace(/```$/, "").trim();
  body = body.replace(/^(const|let|var)\s+GAME\s*=\s*/, "").replace(/;\s*$/, "");
  let game;
  try { game = JSON.parse(body); }
  catch { throw new Error("That text isn't valid JSON. Ask the AI to return only the JSON, with no extra text, and paste it again."); }
  const fail = msg => { throw new Error(msg); };
  const filled = value => typeof value === "string" && value.trim() !== "";
  if (!game || typeof game !== "object" || Array.isArray(game)) fail("The pasted content should be a single JSON object that starts with {.");
  const points = game.values ?? [100, 200, 300, 400, 500];
  if (!Array.isArray(points) || !points.length || !points.every(v => Number.isSafeInteger(v) && v > 0)) fail("\"values\" must be a list of positive whole numbers, like [100, 200, 300, 400, 500].");
  if (!Array.isArray(game.categories) || game.categories.length < 1 || game.categories.length > 6) fail("Include between 1 and 6 categories.");
  game.categories.forEach((cat, i) => {
    if (!Array.isArray(cat) || !filled(cat[0])) fail(`Category ${i + 1} needs a name.`);
    if (cat.length - 1 !== points.length) fail(`"${cat[0]}" needs exactly ${points.length} clues, one per point value.`);
    cat.slice(1).forEach((c, j) => {
      if (!Array.isArray(c) || !filled(c[0]) || !filled(c[1])) fail(`Clue ${j + 1} in "${cat[0]}" needs clue text and an accepted response.`);
    });
  });
  if (!Array.isArray(game.finale) || !game.finale.slice(0, 3).every(filled) || game.finale.length < 3) fail("\"finale\" needs a category, a clue, and an accepted response.");
  return {
    title: filled(game.title) ? game.title.trim() : GAME.title,
    eyebrow: typeof game.eyebrow === "string" ? game.eyebrow.trim() : "",
    edition: typeof game.edition === "string" ? game.edition.trim() : "",
    source: typeof game.source === "string" ? game.source.trim() : "",
    values: points,
    categories: game.categories.map(([name, ...clues]) => [name.trim(), ...clues.map(([q, a, src]) => [q.trim(), a.trim(), src ?? null])]),
    finale: [game.finale[0].trim(), game.finale[1].trim(), game.finale[2].trim(), game.finale[3] ?? null]
  };
}
function applyGame(next) {
  Object.assign(GAME, { title: next.title, eyebrow: next.eyebrow, edition: next.edition, source: next.source });
  values.splice(0, values.length, ...next.values);
  categories.splice(0, categories.length, ...next.categories);
  finale.splice(0, finale.length, ...next.finale);
  renderMasthead();
}
// Build a standalone copy of this page with the current content, and save it.
function downloadGame() {
  const j = value => JSON.stringify(value).replace(/</g, "\\u003c");
  const content = `{\n${["title", "eyebrow", "edition", "source"].map(key => `  "${key}": ${j(GAME[key] || "")},`).join("\n")}
  "values": ${j(values)},
  "categories": [\n${categories.map(([name, ...clues]) => `    [${j(name)},\n${clues.map(c => "      " + j(c)).join(",\n")}]`).join(",\n")}
  ],
  "finale": ${j(finale)}\n}`;
  const start = SCRIPT_SOURCE.indexOf("const GAME = ");
  const end = SCRIPT_SOURCE.indexOf("/* =", start);
  const script = SCRIPT_SOURCE.slice(0, start) + "const GAME = " + content + ";\n" + SCRIPT_SOURCE.slice(end);
  const html = `<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${esc(document.title)}</title>\n<style>${STYLE_SOURCE}</style>\n<main>\n<header id="masthead" class="masthead"></header>\n<div id="app"></div>\n<div class="source" id="source"></div>\n</main>\n<script>${script}<\/script>\n</html>\n`;
  const slug = [GAME.title, GAME.edition].filter(Boolean).join(" ").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "review-game";
  const link = Object.assign(document.createElement("a"), {
    href: URL.createObjectURL(new Blob([html], { type: "text/html" })),
    download: slug + ".html"
  });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  return slug + ".html";
}
const format = value => value.toLocaleString("en-US");
const signed = value => (value > 0 ? "+" : value < 0 ? "−" : "") + format(Math.abs(value));
const scoreText = value => value < 0 ? "−" + format(-value) : format(value);
const button = (action, label, css = "", disabled = false) =>
  `<button type="button" data-action="${action}" class="${css}" ${disabled ? "disabled" : ""}>${label}</button>`;
let view, scores, used, active, tried, shown, resolved, last, finalStep, wagers, rulings, message, effect;
let names = ["Team One", "Team Two"];

function reset() {
  view = "setup";
  scores = [0, 0];
  used = new Set();
  active = null;
  tried = [false, false];
  shown = false;
  resolved = false;
  last = null;
  finalStep = 0;
  wagers = [null, null];
  rulings = [null, null];
  message = "";
  effect = null;
}
reset();

// Each category takes a resuscitation-tape zone color, used on its header, tiles, and clue screen.
const zone = col => `--c:var(--z${col % 6})`;
function scoreboard() {
  return `<section class="scorebar" aria-label="Scores">${names.map((name, i) =>
    `<div class="podium team${i}"><span class="team-name">${esc(name)}</span>
      <span class="score" id="score${i}">${scoreText(scores[i])}</span>
      ${effect?.team === i ? `<span class="delta ${effect.delta < 0 ? "loss" : ""}">${signed(effect.delta)}</span>` : ""}</div>`).join("")}</section>`;
}
function rules() {
  return `<details class="rules"><summary>How to play</summary>
    <p>Pick a tile and answer aloud. A correct response earns the tile's points. An incorrect response loses them and gives the other team one chance to steal. The host can pass to reveal the answer and close the clue. Before Final Jeopardy, each team privately wagers up to its score. The highest final score wins.</p></details>`;
}
function board() {
  const total = categories.length * values.length;
  // Categories share the board's rows (subgrid), so a long category name can't knock tiles out of line.
  const rows = `minmax(56px,auto) repeat(${values.length},1fr)`;
  return `<div class="grid" style="grid-template-columns:repeat(${categories.length},minmax(0,1fr));grid-template-rows:${rows}">${categories.map(([category, ...clues], col) =>
    `<section class="category" style="${zone(col)};grid-row:span ${values.length + 1};grid-template-rows:${rows};grid-template-rows:subgrid"><h2>${esc(category)}</h2>${clues.map((_, row) => {
      const id = col * values.length + row;
      const played = used.has(id);
      return `<button type="button" class="tile${played ? " used" : ""}" data-action="tile:${id}" aria-label="${esc(category)}, ${values[row]} points${played ? ", played" : ""}" ${played ? "disabled" : ""}>${played ? "" : values[row]}</button>`;
    }).join("")}</section>`).join("")}</div>
    ${view === "board" ? `<div class="foot"><span class="muted">${used.size} of ${total} clues played</span>
      <div class="actions">${button("undo","Undo last score","quiet",!last)}${used.size === total ? button("final","Go to Final Jeopardy","primary") : button("final","Skip to Final Jeopardy")}</div></div>` : ""}`;
}
function setup() {
  return `<section class="panel setup"><div class="fields">
    ${names.map((name,i) => `<label>Team ${i+1} name<input data-name="${i}" maxlength="32" value="${esc(name)}"></label>`).join("")}</div>
    <div class="actions">${button("start","Start game","primary")}<div class="actions">${button("paste","Load clues from AI","quiet")}${button("edit","Edit clues","quiet")}${button("download","Download game file","quiet")}</div></div></section>` + rules() + board();
}
function importer() {
  return `<section class="panel tool">
    <div class="tool-head"><div><h2>Load clues from an AI</h2>
      <p class="muted">Paste the JSON your AI chatbot returned. Loading replaces every category and clue in this game, then opens the editor so you can review them.</p></div></div>
    <label>AI response (JSON)<textarea id="import-text" class="code-input" rows="14" spellcheck="false" placeholder='{ "title": "…", "categories": [ … ], "finale": [ … ] }'></textarea></label>
    <p class="error" id="import-error" role="alert"></p>
    <div class="tool-foot"><a class="hint" href="https://niharikagoparaju.github.io/ai-toolkit/review-game/" target="_blank" rel="noopener">Get the prompt for your AI chatbot</a>
      <div class="actions">${button("cancel","Cancel","quiet")}${button("import","Load clues","primary")}</div></div>
  </section>`;
}
let editorTab = "cat0";
function editor() {
  const field = (key, label, value, multiline = false, required = true, rows = 2) =>
    `<label>${label}${multiline ? `<textarea rows="${rows}" ${required ? "required" : ""} data-edit="${key}">${esc(value)}</textarea>` : `<input ${required ? "required" : ""} data-edit="${key}" value="${esc(value)}">`}</label>`;
  const tabs = [
    { key: "details", label: "Title and source" },
    ...categories.map(([name], col) => ({ key: "cat" + col, label: name, style: zone(col) })),
    { key: "final", label: "Final Jeopardy", style: "--c:var(--zf)" }
  ];
  if (!tabs.some(t => t.key === editorTab)) editorTab = "cat0";
  const tab = t => `<button type="button" role="tab" class="tab" id="tab-${t.key}" data-action="tab:${t.key}" aria-controls="pane-${t.key}" aria-selected="${t.key === editorTab}" tabindex="${t.key === editorTab ? 0 : -1}"${t.style ? ` style="${t.style}"` : ""}>${t.style ? `<span class="dot" aria-hidden="true"></span>` : ""}<span class="tab-label">${esc(t.label)}</span></button>`;
  const pane = (key, body, style = "") => `<section class="pane" role="tabpanel" id="pane-${key}" aria-labelledby="tab-${key}"${style ? ` style="${style}"` : ""}${key === editorTab ? "" : " hidden"}>${body}</section>`;
  const clueRow = (pts, qKey, aKey, q, a) => `<div class="clue-row"><span class="pts">${pts}</span><div class="clue-fields">${field(qKey,"Clue",q,true,true,3)}${field(aKey,"Accepted response",a,true,true,2)}</div></div>`;
  return `<form class="panel tool editor" id="editor" novalidate>
    <div class="tool-head"><div><h2>Edit clues</h2><p class="muted">Choose a section to edit. Changes apply when you save.</p></div>
      <div class="actions">${button("cancel","Cancel","quiet")}${button("save","Save changes","primary")}</div></div>
    ${message ? `<p class="notice" role="status">${esc(message)}</p>` : ""}
    <p class="error" id="edit-error" role="alert"></p>
    <div class="editor-body">
      <div class="tabs" role="tablist" aria-label="Sections">${tab(tabs[0])}<span class="tab-divider" role="presentation"></span>${tabs.slice(1).map(tab).join("")}</div>
      <div class="panes">
        ${pane("details", `<h3>Title and source</h3>${field("meta:title","Game title",GAME.title)}${field("meta:eyebrow","Line above the title",GAME.eyebrow || "",false,false)}${field("meta:edition","Line below the title",GAME.edition || "",false,false)}${field("meta:source","Source credit",GAME.source || "",true,false)}`)}
        ${categories.map(([name, ...clues], col) => pane("cat" + col,
          `<label class="name-field">Category ${col + 1} name<input required data-edit="title:${col}" value="${esc(name)}"></label>${clues.map(([q, a], row) => clueRow(values[row], `q:${col}:${row}`, `a:${col}:${row}`, q, a)).join("")}`,
          zone(col))).join("")}
        ${pane("final", `<label class="name-field">Final Jeopardy category<input required data-edit="final:0" value="${esc(finale[0])}"></label>${clueRow("Final", "final:1", "final:2", finale[1], finale[2])}`, "--c:var(--zf)")}
      </div>
    </div>
  </form>`;
}
// Switch editor sections without re-rendering, so unsaved edits stay in their fields.
function selectTab(key, focus = false) {
  editorTab = key;
  app.querySelectorAll('[role="tab"]').forEach(tab => {
    const on = tab.id === "tab-" + key;
    tab.setAttribute("aria-selected", on);
    tab.tabIndex = on ? 0 : -1;
    if (on && focus) tab.focus();
  });
  app.querySelectorAll('[role="tabpanel"]').forEach(pane => { pane.hidden = pane.id !== "pane-" + key; });
}
function answer(text, source) {
  return `<div class="answer enter"><span class="label">Answer</span><p>${esc(text)}</p>${source ? `<small>From lecture question ${esc(source)}</small>` : ""}</div>`;
}
function judges(isFinal = false) {
  return `<div class="judges">${names.map((name,i) => {
    const locked = isFinal ? rulings[i] !== null : tried[i];
    const act = (isFinal ? "judge" : "score") + ":" + i;
    return `<div class="judge team${i}"><span class="team-name">${esc(name)}</span>
      ${locked ? `<small>${isFinal ? (rulings[i] ? "Marked correct" : "Marked incorrect") : "Already answered"}</small>` :
      `<div class="actions">${button(act + ":1","Correct","good")}${button(act + ":0","Incorrect","bad")}</div>`}</div>`;
  }).join("")}</div>`;
}
function clue() {
  const col = Math.floor(active / values.length);
  const row = active % values.length;
  const [q,a,source] = categories[col][row+1];
  return `<section class="stage ${!shown && !tried.some(Boolean) ? "enter" : ""}" style="${zone(col)}">
    <p class="stage-meta"><span class="cat">${esc(categories[col][0])}</span><span class="pts">${values[row]} points</span></p>
    <h2 class="clue" tabindex="-1">${esc(q)}</h2>
    ${shown ? answer(a,source) : button("reveal","Reveal answer","primary")}
    ${resolved ? "" : judges()}
    <div class="stage-controls">${resolved ? button("continue","Back to board","primary") : button("pass","Pass and reveal","quiet")}${button("undo","Undo last score","quiet",!last)}</div></section>`;
}
function final() {
  const [category,q,a,source] = finale;
  if (finalStep === 0) return `<section class="stage enter"><p class="stage-meta"><span class="cat">Final Jeopardy</span><span class="pts">Wagers</span></p>
    <h2 class="clue" tabindex="-1">${esc(category)}</h2>
    <p class="note">Each team tells the host its wager privately. Wagers stay hidden until the results.</p>
    <form id="wager-form" class="wagers"><div class="fields">${names.map((name,i) => `<label>${esc(name)} wager, up to ${format(Math.max(0,scores[i]))}
      <input type="password" inputmode="numeric" id="wager${i}" aria-label="${esc(name)} wager" autocomplete="off" ${scores[i] <= 0 ? 'value="0" readonly' : ""}></label>`).join("")}</div>
      <p class="error" role="alert" id="wager-error"></p><div class="stage-controls"><button class="primary">Lock wagers and show clue</button>${button("back","Back to board","quiet")}</div></form></section>`;
  if (finalStep < 3) return `<section class="stage enter"><p class="stage-meta"><span class="cat">Final Jeopardy</span><span class="pts">${esc(category)}</span></p>
    <h2 class="clue" tabindex="-1">${esc(q)}</h2>${finalStep === 1 ? `<p class="note">Teams write their responses privately.</p><div class="stage-controls">${button("final-reveal","Reveal answer","primary")}</div>` :
    answer(a,source) + judges(true) + `<div class="stage-controls">${button("settle","Show final scores","primary",rulings.includes(null))}${button("clear-rulings","Clear rulings","quiet",rulings.every(x => x === null))}</div>`}</section>`;
  const tie = scores[0] === scores[1];
  const winner = scores[0] > scores[1] ? 0 : 1;
  return `<section class="stage victory enter"><p class="stage-meta"><span class="cat">Final results</span></p>
    <h2 tabindex="-1">${tie ? "It’s a tie!" : esc(names[winner]) + " wins!"}</h2>
    <div class="results">${names.map((name,i) => `<div class="result team${i}"><span class="team-name">${esc(name)}</span>
      <strong>${scoreText(scores[i])}</strong><small>Wagered ${format(wagers[i])}, ${rulings[i] ? "correct" : "incorrect"} (${signed(rulings[i] ? wagers[i] : -wagers[i])})</small></div>`).join("")}</div>
    <div class="stage-controls">${button("again","Play again","primary")}</div></section>`;
}
function render(focus = "", animateFinal = false) {
  document.body.dataset.view = view;
  const tool = view === "edit" || view === "import";
  app.innerHTML = (view === "setup" || tool ? "" : scoreboard()) +
    (view === "setup" ? setup() : view === "edit" ? editor() : view === "import" ? importer() : view === "board" ? board() : view === "clue" ? clue() : final()) +
    (view === "edit" ? "" : `<div class="status" role="status">${esc(message)}</div>`);
  if (focus) {
    const target = focus.split(", ").map(selector => app.querySelector(selector)).find(Boolean);
    target?.focus();
  }
  if (effect) animateScore(effect.team, scores[effect.team] - effect.delta, scores[effect.team]);
  if (animateFinal) scores.forEach((score,i) => animateScore(i, score - (rulings[i] ? wagers[i] : -wagers[i]), score));
}
function animateScore(team, from, to) {
  const el = document.querySelector("#score"+team);
  if (!el || matchMedia("(prefers-reduced-motion: reduce)").matches || from === to) return;
  el.classList.add("pop");
  el.textContent = scoreText(from);
  const start = performance.now();
  function frame(now) {
    if (!el.isConnected) return;
    const progress = Math.min(1,(now-start)/370);
    el.textContent = scoreText(Math.round(from+(to-from)*progress));
    if (progress < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
function rememberNames() {
  app.querySelectorAll("[data-name]").forEach((field,i) => {
    names[i] = field.value.trim() || (i ? "Team Two" : "Team One");
  });
}
function saveEdits() {
  const fields = [...app.querySelectorAll("[data-edit]")];
  const blank = fields.find(field => field.required && !field.value.trim());
  if (blank) {
    const pane = blank.closest('[role="tabpanel"]');
    if (pane) selectTab(pane.id.slice(5));
    document.querySelector("#edit-error").textContent = "Fill in every category name, clue, and accepted response before saving.";
    blank.focus();
    return;
  }
  for (const field of fields) {
    const [kind,col,row] = field.dataset.edit.split(":");
    const value = field.value.trim();
    if (kind === "meta") GAME[col] = value;
    else if (kind === "title") categories[col][0] = value;
    else if (kind === "final") {
      if (col !== "0" && finale[col] !== value) finale[3] = null;
      finale[col] = value;
    } else {
      const clue = categories[col][Number(row)+1];
      const fieldIndex = kind === "q" ? 0 : 1;
      if (clue[fieldIndex] !== value) clue[2] = null;
      clue[fieldIndex] = value;
    }
  }
  renderMasthead();
  view = "setup";
  message = "Changes saved. To keep this version, choose Download game file.";
  render('[data-action="download"]');
}
function closeClue() {
  used.add(active);
  active = null;
  view = "board";
}
function score(team, correct) {
  if (view !== "clue" || resolved || tried[team]) return;
  last = {active, tried:[...tried], shown, scores:[...scores]};
  const delta = values[active % values.length] * (correct ? 1 : -1);
  scores[team] += delta;
  effect = {team,delta};
  tried[team] = true;
  message = names[team] + " " + signed(delta) + (correct || tried.every(Boolean) ? ". Clue closed." : ". The other team can steal.");
  resolved = correct || tried.every(Boolean);
  if (resolved) shown = true;
  render(resolved ? '[data-action="continue"]' : '[data-action="score:'+(1-team)+':1"]');
}
app.addEventListener("click", event => {
  const control = event.target.closest("button[data-action]");
  if (!control || control.disabled) return;
  const [action,id,ruling] = control.dataset.action.split(":");
  effect = null;
  message = "";
  switch(action) {
    case "start": rememberNames(); view = "board"; break;
    case "edit": rememberNames(); editorTab = "cat0"; view = "edit"; render("#tab-cat0"); return;
    case "paste": rememberNames(); view = "import"; render("#import-text"); return;
    case "tab": selectTab(id); return;
    case "cancel": view = "setup"; break;
    case "save": saveEdits(); return;
    case "download": message = "Downloaded " + downloadGame() + ". Open it in any browser to play."; break;
    case "import": {
      const text = app.querySelector("#import-text").value;
      try {
        applyGame(parseGame(text));
      } catch (error) {
        app.querySelector("#import-error").textContent = error.message;
        app.querySelector("#import-text").focus();
        return;
      }
      reset();
      editorTab = "cat0";
      view = "edit";
      message = `Loaded ${categories.length} categories from the AI. Review each section, then choose Save changes.`;
      render("#tab-cat0");
      return;
    }
    case "tile":
      if (view === "setup") rememberNames();
      active = Number(id); view = "clue"; tried = [false,false]; shown = false; resolved = false;
      render(".clue"); return;
    case "score": score(Number(id), ruling === "1"); return;
    case "reveal": shown = true; render('.judge button:not(:disabled), [data-action="pass"]'); return;
    case "pass": resolved = true; shown = true; message = "Clue passed."; render('[data-action="continue"]'); return;
    case "continue": {
      const played = active;
      closeClue();
      render('[data-action="tile:'+(played+1)+'"]:not(:disabled), .tile:not(:disabled), [data-action="final"]'); return;
    }
    case "undo":
      if (!last) return;
      ({active,tried,shown,scores} = last);
      used.delete(active); resolved = false;
      last = null; view = "clue"; message = "Last score undone. Clue reopened.";
      render(".clue"); return;
    case "final": view = "final"; render(".clue"); return;
    case "back": view = "board"; break;
    case "final-reveal": finalStep = 2; break;
    case "judge": rulings[Number(id)] = ruling === "1"; break;
    case "clear-rulings": rulings = [null,null]; break;
    case "settle":
      if (finalStep !== 2 || rulings.includes(null)) return;
      scores = scores.map((value,i) => value + (rulings[i] ? wagers[i] : -wagers[i]));
      finalStep = 3;
      render(".victory h2", true); return;
    case "again": reset(); break;
  }
  render(view === "board" ? '.tile:not(:disabled), [data-action="final"]' : view === "final" ? ".clue" : "");
});
app.addEventListener("keydown", event => {
  if (event.target.getAttribute("role") !== "tab") return;
  const tabs = [...app.querySelectorAll('[role="tab"]')];
  const i = tabs.indexOf(event.target);
  const next = { ArrowDown: i + 1, ArrowRight: i + 1, ArrowUp: i - 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[event.key];
  if (next === undefined) return;
  event.preventDefault();
  selectTab(tabs[(next + tabs.length) % tabs.length].id.slice(4), true);
});
app.addEventListener("input", event => {
  const [kind, col] = (event.target.dataset?.edit || "").split(":");
  if (kind === "title") app.querySelector(`#tab-cat${col} .tab-label`).textContent = event.target.value.trim() || `Category ${Number(col) + 1}`;
});
app.addEventListener("submit", event => {
  event.preventDefault();
  if (event.target.id === "editor") { saveEdits(); return; }
  if (event.target.id !== "wager-form" || finalStep !== 0) return;
  const entries = names.map((_,i) => document.querySelector("#wager"+i));
  const invalid = entries.findIndex((entry,i) => !/^\d+$/.test(entry.value) ||
    !Number.isSafeInteger(Number(entry.value)) || Number(entry.value) > Math.max(0,scores[i]));
  if (invalid >= 0) {
    document.querySelector("#wager-error").textContent = "Enter a whole-number wager within the displayed range for each team.";
    entries[invalid].focus();
    return;
  }
  wagers = entries.map(entry => Number(entry.value));
  finalStep = 1;
  render(".clue");
});
render();
</script>
</html>
